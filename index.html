<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#365e50">
  <title>拾序 · 轻量任务看板</title>
  <link rel="stylesheet" href="./base.css">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div><p class="eyebrow">SHIXU / PERSONAL WORKSPACE</p><h1>拾序<span class="brand-dot">.</span></h1><p class="muted">把想法放下来，让重要的事往前走。</p></div>
      <div class="hero-note"><span id="date-label"></span><strong>给专注留一点空间</strong><span class="muted">数据仅保存在当前浏览器</span></div>
    </header>
    <section class="metrics" aria-label="任务统计" id="metrics"></section>
    <section class="card horizon"><div class="row"><h2>未来 7 天</h2><span class="muted">未完成任务的截止分布</span></div><div id="week" class="week"></div></section>
    <section class="workspace">
      <aside class="card composer">
        <div class="row"><h2 id="form-heading">添加一个任务</h2><span class="badge" id="form-mode">新建</span></div>
        <p class="muted">小步推进，也是一种进展。</p>
        <form id="task-form" class="stack">
          <label>任务名称<input name="title" required maxlength="120" placeholder="下一件值得做的事" autocomplete="off"></label>
          <label>备注<textarea name="notes" rows="3" maxlength="2000" placeholder="补充背景、步骤或灵感"></textarea></label>
          <div class="form-pair">
            <label>优先级<select name="priority"><option value="high">高优先</option><option value="medium" selected>中优先</option><option value="low">低优先</option></select></label>
            <label>状态<select name="status"><option value="todo">待开始</option><option value="doing">进行中</option><option value="done">已完成</option></select></label>
          </div>
          <label>截止日期<input name="due" type="date"></label>
          <label>标签<input name="tags" maxlength="199" placeholder="工作, 阅读（逗号分隔）"><span class="field-help">最多 8 个标签，每个不超过 24 字</span></label>
          <button type="submit" id="submit-task">添加任务</button>
          <button type="button" class="secondary" id="cancel-edit" hidden>取消编辑</button>
        </form>
        <div class="local-tools"><h3>你的数据，你做主</h3><p class="muted">建议定期导出备份，清理浏览器数据会删除本地任务。</p><div class="tool-grid"><button class="secondary" id="export">导出备份</button><button class="secondary" id="import">导入备份</button><button class="secondary" id="sample">加载示例</button><button class="secondary" id="clear-done">清理已完成</button></div><input type="file" id="import-file" accept="application/json,.json" hidden></div>
      </aside>
      <section class="board-area" aria-label="任务看板">
        <div class="toolbar filters">
          <label class="search-field"><span class="sr-only">搜索任务、备注或标签</span><input id="search" type="search" placeholder="搜索任务、备注或标签"></label>
          <label><span class="sr-only">筛选优先级</span><select id="filter-priority"><option value="">全部优先级</option><option value="high">高优先</option><option value="medium">中优先</option><option value="low">低优先</option></select></label>
          <label><span class="sr-only">筛选截止日期</span><select id="filter-due"><option value="">全部日期</option><option value="today">今天截止</option><option value="overdue">已经逾期</option><option value="none">未设日期</option></select></label>
          <label><span class="sr-only">排序方式</span><select id="sort"><option value="priority">优先级排序</option><option value="due">截止日排序</option><option value="newest">最新创建</option><option value="title">名称排序</option></select></label>
        </div>
        <div class="row board-caption"><p id="result-count" class="muted"></p><button class="text-button" id="reset-filters">重置筛选</button></div>
        <div id="board" class="board"></div>
      </section>
    </section>
    <p id="status" class="status" role="status" aria-live="polite">工作台已就绪。</p>
    <footer class="muted">拾序 · 轻量任务看板　/　无需账户，离线可用</footer>
  </main>
</body>
</html>
